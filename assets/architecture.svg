<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="FakeShield AI architecture">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a24"/><stop offset="1" stop-color="#1a0e48"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7ff"/></marker>
</defs>
<rect width="1200" height="400" rx="18" fill="url(#bg)"/>
<text x="30" y="40" font-size="22" font-weight="800" fill="#f2f3ff">Architecture</text>
<text x="30" y="62" font-size="14" fill="#9aa2e0">Two encoders, one fusion block, one classifier</text>
<rect x="30" y="92" width="140" height="60" rx="12" fill="rgba(59,130,246,.22)" stroke="#60a5fa" stroke-width="1.5"/><text x="100.0" y="128.0" text-anchor="middle" font-size="17" font-weight="700" fill="#f2f3ff">News text</text><rect x="200" y="92" width="140" height="60" rx="12" fill="rgba(59,130,246,.22)" stroke="#60a5fa" stroke-width="1.5"/><text x="270.0" y="119.0" text-anchor="middle" font-size="17" font-weight="700" fill="#f2f3ff">Tokenizer</text><text x="270.0" y="140.0" text-anchor="middle" font-size="13" fill="#b4b9ee">max 64 tokens</text><rect x="370" y="92" width="140" height="60" rx="12" fill="rgba(59,130,246,.22)" stroke="#60a5fa" stroke-width="1.5"/><text x="440.0" y="119.0" text-anchor="middle" font-size="17" font-weight="700" fill="#f2f3ff">BERT</text><text x="440.0" y="140.0" text-anchor="middle" font-size="13" fill="#b4b9ee">bert-base-uncased</text><rect x="540" y="92" width="140" height="60" rx="12" fill="rgba(59,130,246,.22)" stroke="#60a5fa" stroke-width="1.5"/><text x="610.0" y="119.0" text-anchor="middle" font-size="17" font-weight="700" fill="#f2f3ff">Projection</text><text x="610.0" y="140.0" text-anchor="middle" font-size="13" fill="#b4b9ee">768 to 512</text><path d="M170 122.0 L200 122.0" stroke="#9aa7ff" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M340 122.0 L370 122.0" stroke="#9aa7ff" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M510 122.0 L540 122.0" stroke="#9aa7ff" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="30" y="262" width="140" height="60" rx="12" fill="rgba(16,185,129,.20)" stroke="#34d399" stroke-width="1.5"/><text x="100.0" y="298.0" text-anchor="middle" font-size="17" font-weight="700" fill="#f2f3ff">Image</text><rect x="200" y="262" width="140" height="60" rx="12" fill="rgba(16,185,129,.20)" stroke="#34d399" stroke-width="1.5"/><text x="270.0" y="289.0" text-anchor="middle" font-size="17" font-weight="700" fill="#f2f3ff">Transform</text><text x="270.0" y="310.0" text-anchor="middle" font-size="13" fill="#b4b9ee">224 x 224, normalize</text><rect x="370" y="262" width="140" height="60" rx="12" fill="rgba(16,185,129,.20)" stroke="#34d399" stroke-width="1.5"/><text x="440.0" y="289.0" text-anchor="middle" font-size="17" font-weight="700" fill="#f2f3ff">ResNet50</text><text x="440.0" y="310.0" text-anchor="middle" font-size="13" fill="#b4b9ee">ImageNet weights</text><rect x="540" y="262" width="140" height="60" rx="12" fill="rgba(16,185,129,.20)" stroke="#34d399" stroke-width="1.5"/><text x="610.0" y="289.0" text-anchor="middle" font-size="17" font-weight="700" fill="#f2f3ff">Projection</text><text x="610.0" y="310.0" text-anchor="middle" font-size="13" fill="#b4b9ee">2048 to 512</text><path d="M170 292.0 L200 292.0" stroke="#9aa7ff" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M340 292.0 L370 292.0" stroke="#9aa7ff" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M510 292.0 L540 292.0" stroke="#9aa7ff" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="750" y="160" width="170" height="100" rx="12" fill="rgba(139,92,246,.30)" stroke="#c4b5fd" stroke-width="1.5"/><text x="835.0" y="207.0" text-anchor="middle" font-size="17" font-weight="700" fill="#f2f3ff">Fusion</text><text x="835.0" y="228.0" text-anchor="middle" font-size="13" fill="#b4b9ee">concat / gated / attention</text><path d="M680 122.0 L750 188" stroke="#9aa7ff" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><path d="M680 292.0 L750 232" stroke="#9aa7ff" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="960" y="180" width="100" height="60" rx="12" fill="rgba(99,102,241,.22)" stroke="#8b9cff" stroke-width="1.5"/><text x="1010.0" y="207.0" text-anchor="middle" font-size="17" font-weight="700" fill="#f2f3ff">MLP</text><text x="1010.0" y="228.0" text-anchor="middle" font-size="13" fill="#b4b9ee">256 units</text><path d="M920 210 L960 210" stroke="#9aa7ff" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="1090" y="170" width="90" height="80" rx="12" fill="rgba(34,197,94,.20)" stroke="#4ade80" stroke-width="1.5"/><text x="1135.0" y="207.0" text-anchor="middle" font-size="17" font-weight="700" fill="#f2f3ff">Real</text><text x="1135.0" y="228.0" text-anchor="middle" font-size="13" fill="#b4b9ee">or Fake</text><path d="M1060 210 L1090 210" stroke="#9aa7ff" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><text x="610" y="172" text-anchor="middle" font-size="13" fill="#93c5fd">Integrated Gradients on embeddings</text><text x="610" y="248" text-anchor="middle" font-size="13" fill="#6ee7b7">Grad-CAM on layer4</text><text x="1135" y="270" text-anchor="middle" font-size="13" fill="#b4b9ee">+ explanations</text><text x="30" y="378" font-size="13" fill="#7f86c8">Baselines use one branch only (text.pt or image.pt). The multimodal model uses both.</text></svg>