ize="11" fill="#e9d5ff">4 heads</text><path d="M1082 168 L1106 168" stroke="#9aa7ff" stroke-width="2.2" fill="none" marker-end="url(#ar)"/><rect x="1108" y="150" width="46" height="36" rx="8" fill="rgba(139,92,246,.35)" stroke="#c4b5fd"/><text x="1131" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#f2f3ff">MLP</text><text x="830" y="238" font-size="15" fill="#d6d9ff">2 tokens, self-attention, mean</text><text x="830" y="262" font-size="13" fill="#9aa2e0">Each modality can look at the other one.</text></svg>